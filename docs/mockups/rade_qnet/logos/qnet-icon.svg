<?xml version="1.0" encoding="UTF-8"?>
<!--
  QNet icon - For 32 to 64 px: favicons, app tiles, chat avatars.

  The hero mark reduced to what survives at small sizes: a blue
  input, two neurons each side, the Q as the hidden layer, a green
  output, and the one bright route through the Q. No grid, no gloss.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     fill="none"
     role="img"
     aria-label="QNet">
  <title>QNet</title>
  <defs>
    <linearGradient id="qnet-icon-tile" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2f86e6"/>
      <stop offset="100%" stop-color="#0d3f7a"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#qnet-icon-tile)"/>

  <g stroke="#ffffff" stroke-width="7" stroke-opacity="0.38" stroke-linecap="round">
    <path d="M48 128 L92 72"/>
    <path d="M48 128 L92 184"/>
    <path d="M92 72 L164 72"/>
    <path d="M92 184 L164 184"/>
    <path d="M92 72 L164 184"/>
    <path d="M92 184 L164 72"/>
    <path d="M164 72 L208 128"/>
    <path d="M164 184 L208 128"/>
  </g>
  <path d="M48 128 L208 128" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>

  <g fill="#ffffff">
    <circle cx="92" cy="72" r="11"/>
    <circle cx="92" cy="184" r="11"/>
    <circle cx="164" cy="72" r="11"/>
    <circle cx="164" cy="184" r="11"/>
  </g>
  <circle cx="48" cy="128" r="15" fill="#9fd0ff" stroke="#ffffff" stroke-width="5"/>
  <circle cx="208" cy="128" r="15" fill="#3fb950" stroke="#ffffff" stroke-width="5"/>

  <circle cx="128" cy="128" r="44" fill="#0a2c52"/>
  <g stroke="#ffffff" stroke-width="15" stroke-linecap="round">
    <circle cx="128" cy="124" r="22"/>
    <path d="M136 134 L154 152"/>
  </g>
</svg>
